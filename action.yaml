name: Install AWS Session Manager plugin
description: Install AWS Session Manager plugin for the AWS CLI on linux runners
branding:
  icon: package
  color: blue

inputs:
  cache:
    description: Cache the downloaded installer
    required: false
    default: true
  version:
    description: Plugin version to install, for example 1.2.835.0, or "latest"
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Check if pre-installed
      id: ssm-binary-check
      env:
        INPUT_VERSION: ${{ inputs.version }}
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/verify.sh"

    - name: Cache or Restore the installer
      if: ${{ inputs.cache == 'true' && steps.ssm-binary-check.outputs.AWS_SESSION_MANAGER_PREINSTALLED == 'false' }}
      uses: actions/cache@v6
      id: aws-ssm-cache
      with:
        # `~` is expanded by actions/cache, `$HOME` is not.
        # Keep in sync with CACHE_ROOT in scripts/install.sh
        path: ~/.cache/aws-ssm
        # The resolved version is part of the key, so `latest` picks up new
        # releases instead of pinning the repo to whatever it meant on the day
        # the cache was first populated. No restore-keys on purpose: a prefix
        # match would restore an older installer and reintroduce that staleness.
        key: aws-ssm-v1-${{ steps.ssm-binary-check.outputs.AWS_SESSION_MANAGER_OS }}-${{ steps.ssm-binary-check.outputs.AWS_SESSION_MANAGER_ARCH }}-${{ steps.ssm-binary-check.outputs.AWS_SESSION_MANAGER_VERSION }}

    - name: Install Session manager plugin
      if: ${{ steps.ssm-binary-check.outputs.AWS_SESSION_MANAGER_PREINSTALLED == 'false' }}
      env:
        CACHE_HIT: ${{ steps.aws-ssm-cache.outputs.cache-hit == 'true' }}
        CACHE_ENABLED: ${{ inputs.cache == 'true' }}
        OS: ${{ steps.ssm-binary-check.outputs.AWS_SESSION_MANAGER_OS }}
        ARCH: ${{ steps.ssm-binary-check.outputs.AWS_SESSION_MANAGER_ARCH }}
        VERSION: ${{ steps.ssm-binary-check.outputs.AWS_SESSION_MANAGER_VERSION }}
        URL_SEGMENT: ${{ steps.ssm-binary-check.outputs.AWS_SESSION_MANAGER_URL_SEGMENT }}
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/install.sh"
